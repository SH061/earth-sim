<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>지구 진화 시뮬레이션 · 학생</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="student">
  <header class="topbar">
    <div class="tb-left">
      <strong id="stuName">학생</strong>
      <span id="eraBadge" class="badge">시대</span>
      <span id="turnInfo">턴 0</span>
    </div>
    <div class="tb-right">
      <div class="totalScore"><span id="totalScore">0</span><small>/100</small></div>
      <button id="btnPause" type="button">일시정지</button>
      <button id="btnSave" type="button">저장</button>
      <span id="saveStatus" class="save-status">-</span>
      <a href="index.html" class="logout">나가기</a>
    </div>
  </header>

  <main class="grid">
    <section class="panel">
      <h2>환경</h2>
      <div id="envList"></div>
      <div id="moodBox" class="mood"></div>
    </section>

    <section class="panel">
      <h2>생물</h2>
      <div id="speciesList" class="species-grid"></div>
    </section>

    <section class="panel">
      <h2>행동</h2>
      <div id="actions" class="actions"></div>
      <p class="hint">버튼을 누르면 상태가 바뀌고, 몇 턴 동안 쿨다운이 걸립니다.</p>
    </section>

    <section class="panel">
      <h2>점수</h2>
      <div id="scoreList"></div>
      <h3>이번 턴 점수 변화</h3>
      <ul id="reasons" class="reasons"></ul>
    </section>

    <section class="panel">
      <h2>퀘스트</h2>
      <ul id="questList" class="quests"></ul>
    </section>

    <section class="panel">
      <h2>이벤트 로그</h2>
      <ul id="logList" class="log"></ul>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
