<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TERRAEVOLVE · 플레이</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="student">
<div class="hud-frame">

  <!-- ===== 상단 상태바 ===== -->
  <header class="topbar-slim">
    <span class="logo-mark">◐</span>
    <span class="logo-text">TERRA<b>EVOLVE</b></span>
    <span class="chip era" id="eraBadge">시대</span>
    <span class="chip" id="turnInfo">턴 0</span>
    <span class="chip ghost" id="stuName">학생</span>
    <span class="tb-spacer"></span>
    <button id="btnPause" class="btn-chip" type="button">⏸ 일시정지</button>
    <button id="btnSave" class="btn-chip" type="button">▣ 저장</button>
    <span class="save-status" id="saveStatus">-</span>
    <a href="index.html" class="btn-chip link">⏻ 나가기</a>
  </header>

  <!-- ===== 본문: 중앙 월드 + 우측 HUD + 하단 콘솔 ===== -->
  <div class="layout">

    <!-- 중앙 월드 -->
    <main class="world-wrap">
      <div class="world" id="world">
        <div class="w-sky"></div>
        <div class="w-sun"></div>
        <div class="w-stars"></div>
        <div class="w-sea"></div>
        <div class="w-seabed"></div>
        <div class="w-land"></div>
        <div class="w-wetland" id="wWetland"></div>
        <div class="w-forest" id="wForest"></div>
        <div class="w-life" id="wLife"></div>
        <div class="w-scan"></div>
        <div class="w-vignette"></div>
        <div class="w-ticker" id="wTicker"></div>
        <div class="w-caption" id="wCaption"></div>
      </div>
      <div class="habitat-strip" id="habitatStrip"></div>
    </main>

    <!-- 우측 HUD -->
    <aside class="rail">
      <section class="hud-card score-hud">
        <div class="hud-title">◤ DIVERSITY SCORE ◥</div>
        <div class="score-total"><span id="totalScore">0</span><i>/ 100</i></div>
        <div class="score-grid" id="scoreGrid"></div>
        <div class="score-delta" id="reasons"></div>
      </section>

      <section class="hud-card">
        <div class="hud-title">◈ ENVIRONMENT</div>
        <div id="envList" class="gauge-list"></div>
      </section>

      <section class="hud-card">
        <div class="hud-title seg">
          <button class="seg-btn is-active" data-seg="bio" type="button">생물</button>
          <button class="seg-btn" data-seg="quest" type="button">퀘스트</button>
        </div>
        <div class="seg-panel is-active" data-panel="bio">
          <div id="speciesList" class="species-mini"></div>
        </div>
        <div class="seg-panel" data-panel="quest">
          <ul id="questList" class="quests"></ul>
        </div>
      </section>
    </aside>

    <!-- 콘솔 로그 (중앙 하단) -->
    <section class="console">
      <div class="console-head">◤ SYSTEM LOG ◥ <span class="blink">_</span></div>
      <ul id="logList" class="log"></ul>
    </section>
  </div>

  <!-- ===== 하단 커맨드 패널 ===== -->
  <footer class="command-bar">
    <div class="cmd-label">◤ COMMAND ◥</div>
    <div id="actions" class="cmd-actions"></div>
  </footer>

</div>

<div id="toast" class="toast" hidden></div>

<script src="js/config.js"></script>
<script src="js/sim.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
