<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TERRAEVOLVE · 접속</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <div class="boot-screen">
    <div class="boot-stars"></div>

    <div class="boot-inner">
      <div class="game-logo">
        <div class="logo-orbit"><span class="planet"></span></div>
        <h1>TERRA<b>EVOLVE</b></h1>
        <p class="tagline">행성 생명 진화 시뮬레이터</p>
      </div>

      <form id="loginForm" class="console-panel">
        <div class="panel-head">▶ 지휘관 접속</div>

        <div class="field">
          <label>소속 반</label>
          <select id="inClass"></select>
        </div>
        <div class="field">
          <label>번호</label>
          <input id="inNumber" type="number" min="1" max="50" required>
        </div>
        <div class="field">
          <label>이름</label>
          <input id="inName" type="text" autocomplete="off" required>
        </div>
        <div class="field">
          <label>암호 (숫자 4자리)</label>
          <input id="inPw" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required>
        </div>

        <button type="submit" class="btn-start">▶ 시뮬레이션 시작</button>
        <p id="loginMsg" class="msg"></p>
      </form>

      <div class="boot-menu">
        <a href="teacher.html" class="btn-sub">⚙ 교사 관제 콘솔</a>
      </div>

      <p class="note">
        첫 접속 시 입력한 암호로 계정이 생성됩니다(교육용 단순화).
        개인적으로 쓰는 중요한 비밀번호는 재사용하지 마세요.
      </p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
